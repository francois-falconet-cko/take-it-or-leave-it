<!--
  Browser-tab icon. Deliberately geometric and on-palette (brand blue tile, lime
  accent) rather than a traced "C" — an approximation of the real mark at 16px
  would read as a broken logo. Replace with the official favicon when one is to
  hand; Next serves whatever sits at app/icon.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#2A5DF5" />
  <path
    d="M21.5 11.2a7 7 0 1 0 0 9.6"
    fill="none"
    stroke="#F8FAFD"
    stroke-width="3.4"
    stroke-linecap="round"
  />
  <circle cx="24.2" cy="16" r="2.4" fill="#B3FF00" />
</svg>
